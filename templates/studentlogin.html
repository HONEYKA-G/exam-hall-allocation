<!DOCTYPE html>
<html>
  <head>
    <title>Student - Exam Details</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        width: 100%;
        max-width: 450px;
        padding: 20px;
      }

      .login-card {
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        padding: 40px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .login-header h1 {
        font-size: 2rem;
        color: #333;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .login-header p {
        color: #666;
        font-size: 0.95rem;
      }

      .form-floating {
        margin-bottom: 15px;
      }

      .form-control {
        border-radius: 5px;
        padding: 12px;
        font-size: 0.95rem;
      }

      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
      }

      .btn-login {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 5px;
        margin-top: 20px;
        color: white;
      }

      .btn-login:hover {
        background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .alert {
        margin-bottom: 20px;
        border-radius: 5px;
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
      }

      .back-link a:hover {
        text-decoration: underline;
      }

      .icon-header {
        font-size: 3rem;
        color: #667eea;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="icon-header">
            <i class="fas fa-graduation-cap"></i>
          </div>
          <h1>Student Portal</h1>
          <p>View Your Exam Details</p>
        </div>

        {% with messages = get_flashed_messages(category_filter=['login-error']) %}
          {% if messages %}
            <div class="alert alert-danger">
              <ul class="list-unstyled mb-0">
                {% for message in messages %}
                  <li><i class="fas fa-exclamation-circle"></i> {{ message }}</li>
                {% endfor %}
              </ul>
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('student_login') }}">
          <div class="form-floating">
            <input
              type="text"
              class="form-control"
              id="roll_num"
              name="roll_num"
              placeholder="Enter Roll Number"
              required
            />
            <label for="roll_num"><i class="fas fa-id-card"></i> Roll Number</label>
          </div>

          <button class="btn btn-primary btn-login w-100" type="submit">
            <i class="fas fa-search"></i> View Exam Details
          </button>
        </form>

        <div class="back-link">
          <p><a href="/"><i class="fas fa-home"></i> Back to Home</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
